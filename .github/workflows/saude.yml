name: saude-turmas

# Vigia as 4 turmas durante a aula. Job vermelho = alguém precisa olhar.
#
# Em 15/09 a logmax-contabilidade ficou seis minutos respondendo 504 em tudo,
# login incluído, e quem percebeu foi o professor no meio da aula. Nada estava
# olhando. O cron mora aqui, e não na Vercel, porque o plano Hobby está em 12/12
# funções.
#
# Horários (Acre, UTC−5), com margem nas pontas:
#   manhã  07:40–11:20  →  12:40–16:20 UTC
#   tarde  13:20–16:50  →  18:20–21:50 UTC
#
# ─── SOBRE A JANELA, QUE JÁ DEIXOU UMA QUEDA PASSAR ─────────────────────────
#
# O comentário que estava aqui dizia que "a janela de 25 min cobre a folga entre
# execuções". Não cobria. O agendamento do GitHub é best-effort e, para repo em
# plano gratuito, `*/15` não é entregue a cada 15 min: em 22/09 as execuções
# saíram às 16:04, 19:43 e 20:52 UTC — folga real de mais de uma hora. A queda
# daquele dia foi 19:03–19:11; a execução de 19:43 olhou de 19:23 para frente e
# passou verde. A aula caiu, o vigia disse OK, e quem percebeu foi o professor
# outra vez.
#
# Agora a janela é de 120 min (padrão do script) e não custa nada, porque a
# avaliação passou a ser MINUTO A MINUTO — janela larga não dilui mais nada.
# O porquê está escrito em scripts/saude-turmas.mjs, que é onde a régua mora.
#
# O cron continua pedindo de 15 em 15: quando o GitHub entrega, melhor: a queda
# é vista mais perto da hora. Quando não entrega, a janela cobre.

on:
  schedule:
    - cron: '*/15 12-16 * * 1-5'   # turma da manhã
    - cron: '*/15 18-21 * * 1-5'   # turma da tarde
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Janela a olhar, em minutos (a API dos logs guarda 24h)'
        required: false
        default: '120'
      fim:
        description: 'Fim da janela em ISO, para investigar o passado (vazio = agora)'
        required: false
        default: ''

jobs:
  saude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem `npm ci` de propósito: o script não tem dependência nenhuma (usa
      # fetch nativo), e instalar o repo inteiro a cada 15 minutos seria minuto
      # de runner gasto à toa.
      - name: Medir as 4 turmas
        run: |
          node scripts/saude-turmas.mjs \
            --minutos=${{ github.event.inputs.minutos || '120' }} \
            ${{ github.event.inputs.fim && format('--fim={0}', github.event.inputs.fim) || '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
